name: earth-analytics-python-lj

channels:
  - conda-forge
  - nodefaults          # never fall back to Anaconda defaults (mixing channels breaks GDAL/PROJ)

dependencies:
  - python=3.11
  - pip
  - git                 # needed for the earthpy GitHub install on Windows

  # Core scientific python
  - numpy
  - pandas
  - scipy
  - dask

  # Geospatial core (all from conda-forge, never pip)
  - gdal                # provides `from osgeo import gdal`
  - rasterio
  - pyproj>=3.0
  - geopy
  - cartopy
  - geopandas
  - geojson
  - pyogrio

  # Raster data
  - xarray
  - h5py
  - netcdf4
  - rioxarray>=0.3.0
  - xarray-spatial
  - regionmask

  # earthpy dependencies, installed by conda so pip doesn't fetch GDAL-bundling wheels
  - scikit-image
  - requests

  # Interactive computing
  - ipython
  - jupyterlab
  - notebook
  - tqdm
  - jupyter-resource-usage   # renamed from nbresuse
  - papermill
  - nbclean                  

  # ML and modeling
  - scikit-learn
  - scikit-fuzzy

  # Data access
  - earthaccess
  - pystac-client
  - adlfs
  - dataretrieval
  - osmnx

  # Plotting: matplotlib
  - matplotlib
  - nc-time-axis
  - contextily
  - seaborn

  # Plotting: HoloViz -- solve together, no upper pin
  - holoviews>=1.20
  - hvplot
  - geoviews>=1.10
  - panel
  - bokeh
  - jupyter_bokeh
  - selenium
  - firefox                  # replaces phantomjs for Bokeh PNG export
  - geckodriver

  # Folium
  - folium

  # QA
  - flake8
  - flake8-import-order
  - black
  - autopep8
  - pydocstyle
  - nbqa

  - pip:
      - pygbif
      - git+https://github.com/earthlab/earthpy.git@v0.10.1
